# Builds Radial Convert for macOS and Windows and drafts a GitHub release.
#
# Trigger: push a tag like v0.1.0 (it must equal the version in
# app/src-tauri/tauri.conf.json). Run it by hand (Actions tab) to test the
# builds without publishing anything.
#
# A tag with a suffix, like v0.1.0-beta.1, is a BETA: it builds everything like a normal
# release, but the draft is marked as a pre-release, so /releases/latest and the one-line
# installers are not affected. The part before the "-" must still equal the app version.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          # v0.1.0-beta.1 is a beta of 0.1.0: compare without the suffix.
          tag_version="${GITHUB_REF_NAME%%-*}"
          if [ "v$version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version v$version" >&2
            exit 1
          fi

  # The `radial` command-line installer, one binary per platform.
  cli:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: radial-macos-aarch64, binary: radial }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: radial-macos-x86_64, binary: radial }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: radial-windows-x86_64.exe, binary: radial.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/radial-packs
          key: ${{ matrix.target }}
      - name: Build
        working-directory: crates/radial-packs
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the binary for the release
        shell: bash
        run: |
          mkdir -p out
          cp "crates/radial-packs/target/${{ matrix.target }}/release/${{ matrix.binary }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  app-macos:
    needs: check-version
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Say whether this build will be signed
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "Developer ID certificate present: $HAVE_CERT"
          echo "Notarization credentials present: $HAVE_NOTARY"
          if [ "$HAVE_CERT" != "true" ]; then echo "::warning::macOS build will be UNSIGNED (no APPLE_CERTIFICATE secret)"; fi
      - name: Install web dependencies
        working-directory: app
        run: npm ci
      # Tauri imports the certificate itself and, when the Apple ID variables are
      # set, submits the app to Apple's notary service and staples the ticket.
      #
      # The signing variables must not exist at all when there is no certificate: GitHub passes a
      # missing secret as an EMPTY variable, and Tauri then tries to import an empty certificate
      # and fails. So there are two steps, and only one of them runs.
      - name: Build universal app (signed and notarized)
        if: ${{ env.HAVE_CERT == 'true' }}
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --verbose --target universal-apple-darwin --bundles app,dmg 2>&1 | tee ../build.log
      - name: Build universal app (unsigned)
        if: ${{ env.HAVE_CERT != 'true' }}
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --verbose --target universal-apple-darwin --bundles app,dmg 2>&1 | tee ../build.log
      # GitHub only shows a job's log to people who are signed in, but annotations are public.
      # So when the build fails, repeat the end of its log as an annotation to make the cause visible.
      - name: Package for the release
        run: |
          bundle="app/src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p out
          # The zip is what install.sh unpacks; the dmg is for people who prefer dragging.
          ditto -c -k --keepParent "$bundle/macos/Radial Convert.app" "out/Radial-Convert-macos-universal.zip"
          cp "$bundle"/dmg/*.dmg "out/Radial-Convert-macos-universal.dmg"
      - name: Show the signature and notarization status
        run: |
          codesign -dv --verbose=2 "app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Radial Convert.app" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier|flags" || true
          spctl -a -vv "app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Radial Convert.app" 2>&1 || true
      - name: Show why the macOS build failed
        if: failure()
        shell: bash
        run: |
          # Strip colour codes (ESC [ ... m), escape the characters annotations treat specially, join the lines.
          text=$(tail -n 40 build.log | sed -E $'s/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=macOS build log (last lines)::${text}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: out/*
          if-no-files-found: error

  app-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install web dependencies
        working-directory: app
        run: npm ci
      - name: Build the installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - name: Name the installer for the release
        shell: bash
        run: |
          mkdir -p out
          cp app/src-tauri/target/release/bundle/nsis/*-setup.exe "out/Radial-Convert-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: out/*
          if-no-files-found: error

  release:
    # Only for real tags; a manual run stops after the builds above.
    # Only for real tags; a manual run stops after the builds above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, app-macos, app-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the install scripts, pointed at this repository
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          # The scripts ship with a placeholder; stamp in the real repo so nobody edits them by hand.
          sed -i "s#OWNER/REPO#$GITHUB_REPOSITORY#g" dist/install.*
          if grep -q "OWNER/REPO" dist/install.*; then echo "placeholder left in an install script" >&2; exit 1; fi
      - name: Checksums
        working-directory: dist
        run: |
          # install.sh / install.ps1 are what people run, so they are listed too.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft: nothing is public until someone reviews the files and clicks Publish.
          flags=""
          title="Radial Convert $GITHUB_REF_NAME"
          notes=THIRD_PARTY_NOTICES.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags="--prerelease"
            title="Radial Convert $GITHUB_REF_NAME (beta)"
            notes=docs/BETA_NOTES.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $flags --generate-notes --title "$title" \
            --notes-file "$notes"
