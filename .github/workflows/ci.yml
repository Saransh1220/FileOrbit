# Builds and tests on the two platforms we ship for. Windows can't be checked
# from a Mac (native C dependencies need the Windows toolchain), so this is the
# real Windows verification.
name: ci

on:
  push:
  pull_request:

jobs:
  packs-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/radial-packs
      - name: Test the installer crate
        working-directory: crates/radial-packs
        run: cargo test

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build the web UI (the Tauri build embeds it)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Test the app crate
        working-directory: app/src-tauri
        run: cargo test

  scripts:
    # install.sh is macOS-only and install.ps1 is Windows-only; each test skips on the other OS.
    # The mirror tool is plain Python.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The failing tests are also written to the run's annotations, which anyone can read
      # (the full log needs a GitHub login).
      - name: Test the install and mirror scripts
        shell: bash
        run: |
          # GitHub runs bash with -e, which would stop at the failing test before the report below.
          set +e
          python -m unittest discover -s scripts -p "test_*.py" 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Script tests failed::$(tail -n 45 test-output.txt | tr '\n' ' ' | cut -c1-1900)"
          fi
          exit "$status"
