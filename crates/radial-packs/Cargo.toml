[package]
name = "radial-packs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
dialoguer = { version = "0.12.0", optional = true }
dirs = "7.0.0"
flate2 = "1.1.10"
indicatif = { version = "0.18.6", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = "3.4.2"
url = "2.5.8"
zip = "9.0.5"

[features]
default = ["cli"]
# Terminal UI. The GUI app depends on this crate with default-features = false.
cli = ["dep:clap", "dep:dialoguer", "dep:indicatif"]

[[bin]]
name = "radial"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keeps debug builds small (see app/src-tauri/Cargo.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
